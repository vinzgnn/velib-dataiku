name: Collecte Vélib

on:
  schedule:
    # Toutes les 30 minutes
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Évite les collectes simultanées qui créeraient des conflits git
concurrency:
  group: collecte-velib
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer la collecte
        run: python collect.py

      - name: Enregistrer les données
        run: |
          git config user.name "velib-bot"
          git config user.email "velib-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Aucun changement à enregistrer"
          else
            git commit -m "Collecte $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
